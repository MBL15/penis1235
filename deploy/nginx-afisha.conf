# Афиша культуры Башкортостана: отдельный виртуальный хост, другие сайты не затрагивает.
# Лежит в /etc/nginx/conf.d/afisha.conf. Замените имя сервера и пути сертификата на свои.

# Журнал доступа без адресов посетителей (ТЗ §10: логи без персональных данных): время, метод, адрес без строки запроса,
# статус, время ответа и сквозной идентификатор запроса, который приложение пишет в свои логи и в заголовок X-Request-ID.
log_format afisha_noip '$time_iso8601 $request_method $uri $status $request_time $request_id';

# Лимит запросов с одного адреса: 10 в секунду на API, всплеск до 40. Второй рубеж после лимитов самого приложения.
limit_req_zone $binary_remote_addr zone=afisha_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=afisha_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name 195-209-220-227.sslip.io;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/afisha-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 195-209-220-227.sslip.io;
    server_tokens off;                 # не показываем версию nginx
    access_log /var/log/nginx/afisha.access.log afisha_noip;

    ssl_certificate /etc/letsencrypt/live/195-209-220-227.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/195-209-220-227.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    client_body_timeout 15s;           # медленные клиенты не держат соединения
    client_header_timeout 15s;
    limit_conn afisha_conn 40;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;      # именно $remote_addr: клиент не может подставить свой адрес
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;          # один идентификатор в логах nginx и приложения
    proxy_hide_header X-Powered-By;

    location ~ ^/api(/v1)?/events/bulk$ {
        client_max_body_size 5m;       # пачка до 500 событий
        limit_req zone=afisha_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }
    location = /api/v1/admin/import {
        client_max_body_size 5m;       # файл с событиями из админки
        limit_req zone=afisha_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }
    location = /metrics {
        return 404;                    # метрики снаружи не нужны: мониторинг читает http://127.0.0.1:8001/metrics с самого сервера
    }
    location /api/ {
        limit_req zone=afisha_api burst=40 nodelay;
        proxy_read_timeout 90s;        # ответ ИИ-помощника ограничен 45 секундами плюс один сетевой таймаут
        proxy_pass http://127.0.0.1:8001;
    }
    location / {
        proxy_pass http://127.0.0.1:8001;
    }
}
